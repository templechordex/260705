<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>round2 - anji TERAOKA</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: #05040f;
      color: #fff4c7;
      --ink: #05040f;
      --cream: #fff4c7;
      --cyan: #65def1;
      --lime: #d6ff3f;
      --violet: #8969d3;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; margin: 0; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(30px, env(safe-area-inset-top)) 22px max(30px, env(safe-area-inset-bottom));
      overflow-x: hidden;
      background:
        radial-gradient(circle at 14% 18%, rgba(101, 222, 241, 0.85) 0 1px, transparent 1.5px),
        radial-gradient(circle at 82% 28%, rgba(255, 244, 199, 0.75) 0 1px, transparent 1.5px),
        radial-gradient(circle at 64% 74%, rgba(214, 255, 63, 0.55) 0 1px, transparent 1.5px),
        radial-gradient(circle at 35% 86%, rgba(137, 105, 211, 0.85) 0 1px, transparent 1.5px),
        linear-gradient(180deg, #09051a 0%, var(--ink) 72%);
      background-size: 170px 190px, 230px 210px, 280px 260px, 310px 290px, auto;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.14;
      background: repeating-linear-gradient(180deg, transparent 0 3px, rgba(101, 222, 241, 0.12) 4px);
    }

    main {
      position: relative;
      width: min(760px, 100%);
      display: grid;
      gap: 26px;
      padding: clamp(28px, 7vw, 64px);
      border: 1px solid rgba(101, 222, 241, 0.58);
      box-shadow: 8px 8px 0 rgba(137, 105, 211, 0.38);
      background: rgba(5, 4, 15, 0.84);
      text-align: center;
    }

    .eyebrow {
      margin: 0;
      color: var(--cyan);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 10px 0 0;
      color: var(--cream);
      font-size: clamp(56px, 16vw, 118px);
      font-weight: 900;
      line-height: 0.8;
      letter-spacing: -0.075em;
      text-shadow: 4px 4px 0 #ff5b4d, 8px 8px 0 var(--violet);
    }

    button, .stream-link {
      min-height: 48px;
      border: 1px solid var(--violet);
      border-radius: 0;
      color: var(--cream);
      background: transparent;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 140ms ease, background-color 140ms ease, color 140ms ease, transform 140ms ease;
    }

    button:hover, button:focus-visible, .stream-link:hover, .stream-link:focus-visible {
      border-color: var(--cyan);
      outline: 1px solid var(--cyan);
      outline-offset: 3px;
      transform: translate(-2px, -2px);
    }

    #sound-button {
      width: min(280px, 100%);
      margin-inline: auto;
      padding: 15px 28px;
      background: var(--lime);
      color: var(--ink);
      border-color: var(--lime);
      box-shadow: 5px 5px 0 var(--violet);
      font-size: 14px;
    }

    #sound-button[aria-pressed="true"] {
      background: transparent;
      color: var(--lime);
      border-color: var(--lime);
    }

    #mode-controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    #mode-controls[hidden] { display: none; }

    .mode-button { padding: 13px 8px; }

    .mode-button[aria-pressed="true"] {
      border-color: var(--cream);
      background: var(--cream);
      color: var(--ink);
    }

    .progress-wrap { display: grid; gap: 10px; }

    #progress-track {
      height: 3px;
      overflow: hidden;
      background: rgba(255, 244, 199, 0.18);
    }

    #progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--lime));
    }

    #time-label {
      margin: 0;
      color: rgba(255, 244, 199, 0.58);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.1em;
    }

    .streaming-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .stream-link {
      min-width: 150px;
      padding: 13px 18px;
      text-decoration: none;
    }

    #status {
      min-height: 1.4em;
      margin: 0;
      color: var(--cyan);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 520px) {
      main {
        gap: 22px;
        padding: 34px 18px;
        box-shadow: 5px 5px 0 rgba(137, 105, 211, 0.38);
      }
      h1 { text-shadow: 3px 3px 0 #ff5b4d, 6px 6px 0 var(--violet); }
      .mode-button { font-size: 10px; letter-spacing: 0.07em; }
      .streaming-links { display: grid; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Interactive mix / headphones recommended</p>
      <h1>ROUND</h1>
    </header>

    <button id="sound-button" type="button" aria-pressed="false">SOUND</button>

    <div id="mode-controls" aria-label="Sound mode" hidden>
      <button class="mode-button" type="button" data-variant="round_roomy" aria-pressed="false">Dry</button>
      <button class="mode-button" type="button" data-variant="round" aria-pressed="true">Center</button>
      <button class="mode-button" type="button" data-variant="round_dry" aria-pressed="false">Round</button>
    </div>

    <div class="progress-wrap" aria-label="Playback progress">
      <div id="progress-track"><div id="progress-fill"></div></div>
      <p id="time-label">0:00 / 0:00</p>
    </div>

    <nav class="streaming-links" aria-label="Streaming links">
      <a class="stream-link" href="https://open.spotify.com/artist/31FfWVdW1IUmPgLoRbSGpS" target="_blank" rel="noopener noreferrer">Spotify</a>
      <a class="stream-link" href="https://music.apple.com/us/artist/anji-teraoka/1538384131" target="_blank" rel="noopener noreferrer">Apple Music</a>
    </nav>

    <p id="status" aria-live="polite"></p>
  </main>

  <script type="module" src="round2.js?v=20261019-site-style"></script>
</body>
</html>
